name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Собрать exe и установщик
        shell: pwsh
        run: .\build.ps1

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: ajazz-battery
          path: |
            dist/AJAZZ-Battery-Setup.exe
            dist/AJAZZ-Battery-Portable.zip
          retention-days: 14

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "dist/AJAZZ-Battery-Setup.exe" `
            "dist/AJAZZ-Battery-Portable.zip" `
            --title "AJAZZ Battery $tag" `
            --generate-notes
