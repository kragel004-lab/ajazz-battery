name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Собрать exe и установщик
        shell: pwsh
        run: .\build.ps1

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: ajazz-battery
          path: |
            dist/AJAZZ-Battery-Setup.exe
            dist/AJAZZ-Battery-Portable.zip
          retention-days: 14

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $lines = @(
            "Battery level of the AJAZZ AJ159 APEX mouse in the Windows tray and taskbar — no official driver needed.",
            "Заряд мыши AJAZZ AJ159 APEX в трее и на панели задач Windows — без официального драйвера.",
            "",
            "| Версия | Файл |",
            "|---|---|",
            "| **Установщик** (рекомендуется) | [AJAZZ-Battery-Setup.exe](https://github.com/$repo/releases/download/$tag/AJAZZ-Battery-Setup.exe) |",
            "| **Портативная** | [AJAZZ-Battery-Portable.zip](https://github.com/$repo/releases/download/$tag/AJAZZ-Battery-Portable.zip) |",
            "",
            "Подробности и настройки — в [README](https://github.com/$repo#readme) ([Русский](https://github.com/$repo/blob/main/README.ru.md)).",
            "",
            "☕ Поддержать проект: https://boosty.to/koderrr"
          )
          $lines -join "`n" | Out-File -FilePath notes.md -Encoding utf8 -NoNewline
          gh release create $tag `
            "dist/AJAZZ-Battery-Setup.exe" `
            "dist/AJAZZ-Battery-Portable.zip" `
            --title "AJAZZ Battery $tag" `
            --notes-file notes.md
